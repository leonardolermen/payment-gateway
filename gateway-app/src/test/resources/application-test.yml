gateway:
  admin-key: test-admin
  master-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  api-key-pepper: test-pepper
  rate-limit:
    requests-per-minute: 5
  # Off by default in tests: every @SpringBootTest would otherwise bind 8443 (and fail the key-material
  # guard). The mTLS integration test turns it on with its own port and generated stores.
  webhooks:
    mtls:
      port: 0
spring:
  flyway:
    schemas: merchants,payments,billing
    locations: classpath:db/migration/merchants,classpath:db/migration/payments,classpath:db/migration/billing
webhook-delivery:
  # Every app test's sink is on localhost, and lib 0.2.0 refuses private targets by default.
  allow-private-targets: true
management:
  server:
    port: 0   # random, like the app port; tests read it from local.management.port
