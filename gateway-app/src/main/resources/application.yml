spring:
  application:
    name: payment-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true
    # One schema per module; Flyway creates the listed schemas. Versions are prefixed per module
    # (1xx merchants, 2xx payments, 3xx orders) because a single history table needs unique versions.
    schemas: merchants,payments
    locations: classpath:db/migration/merchants,classpath:db/migration/payments

webhook-delivery:
  headers:
    prefix: X-Gateway
  correlation-mdc-key: correlationId
  workers: 3

gateway:
  admin-key: ${GATEWAY_ADMIN_KEY:}
  master-key: ${GATEWAY_MASTER_KEY:}
  api-key-pepper: ${GATEWAY_API_KEY_PEPPER:}
  rate-limit:
    requests-per-minute: 600
  webhooks:
    mtls:
      port: ${WEBHOOK_MTLS_PORT:8443}                 # 0 = no inbound bank webhook connector
      keystore: ${WEBHOOK_MTLS_KEYSTORE:}            # PKCS12 with the server certificate for the public webhook host
      keystore-password: ${WEBHOOK_MTLS_KEYSTORE_PASSWORD:}
      truststore: ${WEBHOOK_MTLS_TRUSTSTORE:}        # PKCS12 with Itau's CA (ca-cert.zip from the portal)
      truststore-password: ${WEBHOOK_MTLS_TRUSTSTORE_PASSWORD:}
      public-host: ${WEBHOOK_MTLS_PUBLIC_HOST:localhost}  # host in the inbound_webhook_url the admin API shows
  providers:
    itau:
      live-api-base: https://pix-pj.api.itau.com/regulatorio-pix/v2
      live-token-url: https://sts.itau.com.br/as/token.oauth2
      test-api-base: https://sandbox.devportal.itau.com.br/itau-ep9-api-regulatorio-pix-v2-externo/v2
      test-token-url: https://sandbox.devportal.itau.com.br/api/oauth/jwt
      test-mutual-tls: false
      live-mutual-tls: true
      trust-store-pem: ${ITAU_CA_PEM:}         # Itau CA chain (ca-cert.zip from the portal); empty = JDK truststore
      read-timeout: PT10S
  payments:
    default-expires-in-seconds: 3600
    expiration-grace: PT5M
    reconciliation-lookback: PT48H
    reconciliation-min-age: PT10M
    idempotency-ttl: PT24H
    job-max-attempts: 8
    job-lease: PT2M
    outbox-lease: PT1M
    outbox-relay-ms: 1000
    jobs-poll-ms: 2000
    stuck-sweep-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
