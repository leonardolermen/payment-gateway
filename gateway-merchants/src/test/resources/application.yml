spring:
  profiles:
    active: test   # MailProperties fails startup outside local/test without SMTP
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: merchants
    locations: classpath:db/migration/merchants
gateway:
  master-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="   # 32 zero bytes: tests only
  api-key-pepper: test-pepper
